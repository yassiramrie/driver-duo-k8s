apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: driver-duo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: yassir0420/driver-duo:1.1
          ports:
            - containerPort: 3000
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: driver-duo-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: driver-duo-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: driver-duo-secret
                  key: POSTGRES_DB
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: driver-duo-secret
                  key: SESSION_SECRET
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db:5432/$(POSTGRES_DB)
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: driver-duo
spec:
  type: NodePort
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
